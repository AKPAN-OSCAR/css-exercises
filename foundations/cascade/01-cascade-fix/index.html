<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fixed cascade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="p1">I'm just a paragraph with extra bold text!</p>
  <p class="p2">I'm a smaller paragraph, also with extra bold text!</p>

  <button class="btn-1">Confirm</button>
  <button class="btn-2">Cancel</button>

  <div class="text">
    I'm a div with thin text!
  </div>

  <div class="child">
    I'm a div with thin text and a child div!
  </div>

  <div class="small-child">I'm a smaller child div with extra bold text.</div>
</body>

</bod>
</html>
